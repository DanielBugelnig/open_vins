%YAML:1.0

# corax camera rig on the CrazySim Crazyflie (written by euroc_postprocess.py).
# T_imu_cam: camera -> IMU (Crazyflie body: x forward, y left, z up).

cam0:
  T_imu_cam: #rotation from camera to IMU R_CtoI, position of camera in IMU p_CinI
    - [0.0028134298, -0.9999906136, -0.0032950401, 0.0150000000]
    - [-0.9999812637, -0.0027954589, -0.0054458874, 0.0000000000]
    - [0.0054366251, 0.0033103000, -0.9999797423, -0.0150000000]
    - [0.0000000000, 0.0000000000, 0.0000000000, 1.0000000000]
  cam_overlaps: []
  camera_model: pinhole
  distortion_coeffs: [-0.28340811, 0.07395907, 0.00019359, 1.76187114e-05]
  distortion_model: radtan
  intrinsics: [458.654, 457.296, 367.215, 248.375] #fu, fv, cu, cv
  resolution: [752, 480]
  rostopic: /cam0/image_raw
  timeshift_cam_imu: 0.0

cam1:
  T_imu_cam: #rotation from camera to IMU R_CtoI, position of camera in IMU p_CinI
    - [-0.0045764017, 0.7088002531, 0.7053943987, 0.0250000000]
    - [-0.9999689867, -0.0077650737, 0.0013150465, 0.0000000000]
    - [0.0064095448, -0.7053665039, 0.7088138070, 0.0050000000]
    - [0.0000000000, 0.0000000000, 0.0000000000, 1.0000000000]
  cam_overlaps: []
  camera_model: pinhole
  distortion_coeffs: [-0.28368365, 0.07451284, -0.00010473, -3.555907e-05]
  distortion_model: radtan
