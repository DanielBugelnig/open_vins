    - [-0.9993566061, -0.0176761679, -0.0312078028, 0.0646769868]
    - [0.0272687021, -0.9396739731, -0.3409827594, -0.0236905525]
    - [0.0000000000, 0.0000000000, 0.0000000000, 1.0000000000]
